services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: generation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d generation"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    command: ["uvicorn", "generation.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/generation
      WEBHOOK_SECRET: dev-webhook-secret
      PROVIDER_TIMEOUT_SECONDS: "60"
      PROVIDER_DISPATCH_TIMEOUT_SECONDS: "3"
      WATCHDOG_INTERVAL_SECONDS: "2"
      APP_PUBLIC_URL: http://app:8000
      ALPHA_URL: http://provider-alpha:8000
      BETA_URL: http://provider-beta:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      provider-alpha:
        condition: service_started
      provider-beta:
        condition: service_started

  provider-alpha:
    build: .
    command: ["uvicorn", "providers.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PROVIDER_NAME: alpha
      WEBHOOK_SECRET: dev-webhook-secret
      PROVIDER_TIMEOUT_SECONDS: "60"
    ports:
      - "8001:8000"

  provider-beta:
    build: .
    command: ["uvicorn", "providers.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PROVIDER_NAME: beta
      WEBHOOK_SECRET: dev-webhook-secret
      PROVIDER_TIMEOUT_SECONDS: "60"
    ports:
      - "8002:8000"
